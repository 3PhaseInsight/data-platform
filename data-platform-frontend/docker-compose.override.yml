services:
  airflow-migrate:
    image: airflow:dev
    depends_on:
      timescaledb:
        condition: service_healthy
      sqitch-runner:
        condition: service_completed_successfully
    networks: [platform_network]
    environment:
      # Database
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    command: airflow db migrate

  airflow-webserver:
    image: airflow:dev
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__API__BASE_URL=http://localhost:8080
    volumes:
      - dags_volume:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs

services:
  airflow-webserver:
    image: ${CI_REGISTRY_IMAGE}/airflow:${IMAGE_TAG}
    command: airflow webserver
    ports: ["8080:8080"]
    networks: [platform_network]
    environment:
      # One-time bootstrap flags (use only on the first run of a fresh DB/image)
      - _AIRFLOW_DB_MIGRATE=True
      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}
      - _AIRFLOW_WWW_USER_FIRSTNAME=3Phase
      - _AIRFLOW_WWW_USER_LASTNAME=Insight
      - _AIRFLOW_WWW_USER_EMAIL=chris@inilab.dk

      # Core + security (must match across ALL components)
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}

      # Celery (shared by webserver, scheduler, workers)
      - AIRFLOW__CELERY__BROKER_URL=${AIRFLOW__CELERY__BROKER_URL}
      - AIRFLOW__CELERY__RESULT_BACKEND=${AIRFLOW__CELERY__RESULT_BACKEND}

      # Webserver runtime
      - AIRFLOW__WEBSERVER__WORKERS=1
      - AIRFLOW__WEBSERVER__WORKER_TIMEOUT=120
      - AIRFLOW__WEBSERVER__BASE_URL=https://airflow.3pi-dev.io
      - AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX=True

      # Silence the warnings you saw
      - AIRFLOW__METRICS__TIMER_UNIT_CONSISTENCY=True
      - AIRFLOW__WEBSERVER__RATELIMIT_ENABLED=True
      - AIRFLOW__WEBSERVER__RATELIMIT_STORAGE_URI=redis://:${REDIS_PASSWORD}@192.168.42.2:6379/1

      # Scheduler/throughput knobs (these affect the whole deployment, not just web)
      - AIRFLOW__POOLS__DATABASE_POOL=3
      - AIRFLOW__CORE__PARALLELISM=2
      - AIRFLOW__SCHEDULER__MAX_TIS_PER_QUERY=8
      - AIRFLOW__SCHEDULER__MAX_ACTIVE_RUNS_PER_DAG=1

      # Quality-of-life
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__LOGGING__REMOTE_LOGGING=True
      - AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER=s3://airflow-logs
      - AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID=minio_logs
      - AIRFLOW_CONN_MINIO_LOGS={"conn_type":"s3","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://${MINIO_HOST}"}}
      # Important: disable log serving via workers
      - AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT=0

    deploy:
      replicas: 1
      restart_policy: { condition: on-failure, delay: 5s, max_attempts: 3, window: 2m }
      placement:
        constraints:
          - node.labels.role == public
      resources:
        reservations:
          cpus: "0.50"
          memory: 512M
        limits:
          cpus: "1.0"
          memory: 2G
      update_config: { parallelism: 1, order: start-first }
    ulimits:
      nofile: 16384
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }


networks:
  platform_network: {}

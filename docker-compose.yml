services:
  redis:
    image: redis:7
    container_name: redis
    networks:
      - platform_network
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    mem_limit: 256M
    cpus: 0.25

  airflow-scheduler:
    image: ${CI_REGISTRY_IMAGE}/airflow:${IMAGE_TAG:-latest}
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - airflow-webserver
      - redis
      - timescaledb
    environment:
      # Executor Config (Celery)
      - AIRFLOW__CELERY__BROKER_URL=${AIRFLOW__CELERY__BROKER_URL}
      - AIRFLOW__CELERY__RESULT_BACKEND=${AIRFLOW__CELERY__RESULT_BACKEND}
      # Airflow Core
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution/
      # Database
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # Logging
      - AIRFLOW_CONN_MINIO_LOGS={"conn_type":"s3","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://${MINIO_HOST}"}}
      # API
      - AIRFLOW__API__SECRET_KEY=${AIRFLOW__API__SECRET_KEY}
      # API Auth
      - AIRFLOW__API_AUTH__JWT_SECRET=${AIRFLOW_TMP_JWT_OVERRIDE}
      # Additional Env Vars for Services
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_ENDPOINT_URL=http://${MINIO_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - csv_data:/opt/airflow/data
    command: airflow scheduler
    networks:
      - platform_network
    mem_limit: 512M
    cpus: 0.5

  airflow-worker:
    image: ${CI_REGISTRY_IMAGE}/airflow:${IMAGE_TAG:-latest}
    container_name: airflow-worker
    restart: always
    depends_on:
      - airflow-webserver
      - redis
      - timescaledb
    environment:
      # Executor Config (Celery)
      - AIRFLOW__CELERY__BROKER_URL=${AIRFLOW__CELERY__BROKER_URL}
      - AIRFLOW__CELERY__RESULT_BACKEND=${AIRFLOW__CELERY__RESULT_BACKEND}
      # Airflow Core
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution/
      # Database
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # Logging
      - AIRFLOW_CONN_MINIO_LOGS={"conn_type":"s3","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://${MINIO_HOST}"}}
      # API
      - AIRFLOW__API__SECRET_KEY=${AIRFLOW__API__SECRET_KEY}
      # API Auth
      - AIRFLOW__API_AUTH__JWT_SECRET=${AIRFLOW_TMP_JWT_OVERRIDE}
      # Additional Env Vars for Services
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_ENDPOINT_URL=http://${MINIO_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
    command: >
      bash -c "airflow celery worker"
    volumes:
      - csv_data:/opt/airflow/data
    networks:
      - platform_network
    mem_limit: 4G
    cpus: 1.0

  dask-scheduler:
    image: ${CI_REGISTRY_IMAGE}/dask:${IMAGE_TAG:-latest}
    container_name: dask-scheduler
    command: dask-scheduler
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_ENDPOINT_URL=http://minio:9000
      # DB Params
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      # Additional Env Vars for Services
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_ENDPOINT_URL=http://${MINIO_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "8786:8786"
      - "8787:8787"
    volumes:
      - csv_data:/opt/airflow/data
    networks:
      - platform_network
    mem_limit: 1G
    cpus: 0.5

  dask-worker:
    image: ${CI_REGISTRY_IMAGE}/dask:${IMAGE_TAG:-latest}
    deploy:
      replicas: 2
    depends_on:
      - dask-scheduler
    command: >
      dask worker tcp://dask-scheduler:8786
          --nthreads 1
          --memory-limit 1.5GB
          --no-dashboard
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_ENDPOINT_URL=http://minio:9000
      # DB Params
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      # Additional Env Vars for Services
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_ENDPOINT_URL=http://${MINIO_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - csv_data:/opt/airflow/data
    networks:
      - platform_network
    mem_limit: 2G
    cpus: 1.0

volumes:
  csv_data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/storage/csv_data
      o: bind

networks:
  platform_network:

services:
  redis:
    image: redis:7
    container_name: redis
    networks:
      - platform_network
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    mem_limit: 256M
    cpus: 0.25

  airflow-scheduler:
    image: ${CI_REGISTRY_IMAGE}/airflow:${IMAGE_TAG:-latest}
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - redis
      - timescaledb
    environment:
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution/
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - AIRFLOW__CELERY__BROKER_URL=${AIRFLOW__CELERY__BROKER_URL}
      - AIRFLOW__CELERY__RESULT_BACKEND=${AIRFLOW__CELERY__RESULT_BACKEND}
      - AIRFLOW__CELERY__WORKER_CONCURRENCY=4
      - AIRFLOW__SCHEDULER__ZOMBIE_TASK_THRESHOLD=1200
      - AIRFLOW__API__SECRET_KEY=${AIRFLOW__API__SECRET_KEY}
      - AIRFLOW__API_AUTH__JWT_SECRET=${AIRFLOW_TMP_JWT_OVERRIDE}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      # DB Params
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      # Connection Pools
      - AIRFLOW__POOLS__DATABASE_POOL=5
      # Logging
      - AIRFLOW__LOGGING__REMOTE_LOGGING=True
      - AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER=s3://airflow-logs
      - AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID=minio_logs
      - AIRFLOW_CONN_MINIO_LOGS={"conn_type":"s3","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://${MINIO_HOST}"}}
      # Log serving via workers
      - AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT=8793
      # S3 Creds
      - s3_access_key=${MINIO_ROOT_USER}
      - s3_secret_key=${MINIO_ROOT_PASSWORD}
      - s3_endpoint_url=http://${MINIO_HOST}
    volumes:
      - csv_data:/opt/airflow/data
    command: airflow scheduler
    networks:
      - platform_network
    mem_limit: 512M
    cpus: 0.5

  airflow-worker:
    image: ${CI_REGISTRY_IMAGE}/airflow:${IMAGE_TAG:-latest}
    container_name: airflow-worker
    restart: always
    depends_on:
      - redis
      - timescaledb
    environment:
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution/
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - AIRFLOW__CELERY__BROKER_URL=${AIRFLOW__CELERY__BROKER_URL}
      - AIRFLOW__CELERY__RESULT_BACKEND=${AIRFLOW__CELERY__RESULT_BACKEND}
      - AIRFLOW__CELERY__WORKER_CONCURRENCY=4
      - AIRFLOW__API__SECRET_KEY=${AIRFLOW__API__SECRET_KEY}
      - AIRFLOW__API_AUTH__JWT_SECRET=${AIRFLOW_TMP_JWT_OVERRIDE}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      # DB Params
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      # Logging
      - AIRFLOW__LOGGING__REMOTE_LOGGING=True
      - AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER=s3://airflow-logs
      - AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID=minio_logs
      - AIRFLOW_CONN_MINIO_LOGS={"conn_type":"s3","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://${MINIO_HOST}"}}
      # Log serving via workers
      - AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT=8793
      # S3 Creds
      - s3_access_key=${MINIO_ROOT_USER}
      - s3_secret_key=${MINIO_ROOT_PASSWORD}
      - s3_endpoint_url=http://${MINIO_HOST}
    command: >
      bash -c "airflow celery worker"
    volumes:
      - csv_data:/opt/airflow/data
    networks:
      - platform_network
    mem_limit: 4G
    cpus: 1.0

  dask-scheduler:
    image: ${CI_REGISTRY_IMAGE}/dask:${IMAGE_TAG:-latest}
    container_name: dask-scheduler
    command: dask-scheduler
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_ENDPOINT_URL=http://minio:9000
      # DB Params
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "8786:8786"
      - "8787:8787"
    volumes:
      - csv_data:/opt/airflow/data
    networks:
      - platform_network
    mem_limit: 1G
    cpus: 0.5

  dask-worker:
    image: ${CI_REGISTRY_IMAGE}/dask:${IMAGE_TAG:-latest}
    deploy:
      replicas: 2
    depends_on:
      - dask-scheduler
    command: >
      dask worker tcp://dask-scheduler:8786
          --nthreads 1
          --memory-limit 1.5GB
          --no-dashboard
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_ENDPOINT_URL=http://minio:9000
      # DB Params
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      # Volume settings
      # - DASK_TEMPORARY_DIRECTORY=/dask-scratch/worker
      # - TMPDIR=/dask-scratch/worker
    volumes:
      - csv_data:/opt/airflow/data
      # - /mnt/storage/dask-scratch/worker:/dask-scratch/worker
    networks:
      - platform_network
    mem_limit: 2G
    cpus: 1.0

volumes:
  csv_data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/storage/csv_data
      o: bind

networks:
  platform_network:

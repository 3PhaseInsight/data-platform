services:
  timescaledb:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME -h 127.0.0.1" ]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    volumes:
      - local_timescale_data:/var/lib/postgresql/data

  minio:
    volumes:
      - local_minio_data:/data

  minio_createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - platform_network
    entrypoint: ["sh", "-c"]
    command: >
      "mc alias set minio http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing minio/3phi &&
      mc mb --ignore-existing minio/airflow-logs"
    restart: "no"

  sqitch-runner:
    image: sqitch/sqitch
    working_dir: /sqitch
    environment:
      ROLE: threephi_db_user
      ROLE_PW: userpass
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - local_sqitch:/sqitch
    networks:
      - platform_network
    entrypoint: [ "bash", "-lc" ]
    command: >
      "ls && ./create-db-user.sh ${DB_HOST} ${DB_PORT} ${DB_USER} ${DB_PASSWORD} $${ROLE} $${ROLE_PW} ${DB_NAME}
      && ./sqitch-deploy.sh ${DB_HOST}:${DB_PORT} ${DB_USER} ${DB_PASSWORD} ${DB_NAME}"

volumes:
  local_timescale_data: {}
  local_minio_data: {}
  local_sqitch:
    driver: local
    driver_opts:
      type: none
      device: ./data-platform-infrastructure/sqitch
      o: bind

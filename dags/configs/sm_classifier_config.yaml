# Config for the sm_classifier DAG, consumed by threephi_framework.SMClassifier.
# See the SMClassifier docstring for the full list of supported parameters.

dask:
  host: dask-scheduler
  port: "8786"
  n_workers: 4 # Used to chunk meters across workers; should not exceed the number of Dask workers

use_dask: true # Distribute meter evaluation across the Dask cluster

data_dir_path: phase_measurements/raw # Object-storage path of the raw timeseries dataset
sm_ids: ["17", "40", "87", "116"] # "All" to classify every meter with data, or a list of SM ID strings

save_plots: true # Whether to create and save plots of the SM timeseries data (intensive)
plot_cfg: {
      "SM_selection": { # allows to define which SM to plot timeseries data for.
      "All_(with_dataset_containing_data)": True, # True or False
      "With_only_good_data_quality": True, # True or False
      "With_any_medium_or_bad_data_quality": True, # True or False
      "With_1-phase_connection": True, # True or False
      "With_2-phase_connection": True, # True or False
      "With_connection_error": True, # True or False
      "With_on_off_switch": True,
      },

      "Variable_selection":
      ["V", "P14", "P23", "Q12", "Q34"],

      "Phase_selection":
      ["L1", "L2", "L3"],

      "Plotting_format": {
      "plot_format": "svg",
      "plot_dpi": 300,
      "plot_transparent": false,
      "overwrite_plots": true
      }} # Which variables ("V", "P14", "P23", "Q12", "Q34") and phases ("L1", "L2", "L3") to plot

# Detection thresholds (see threephi_framework.dtu.sm_classifier.meter_evaluation)
no_data_limit: 0.025 # Limit defining what counts as having "no data" (fraction of the longest recorded period)
good_data_limit: 0.1 # Limits defining what is "good", "medium", "bad"
medium_data_limit: 0.5 # Limits defining what is "good", "medium", "bad"
v_lim: 207 # lower voltage limit for "plausible" measurements
offset_threshold: 0.95 # Fraction of data below v_lim for a phase to be considered offset
cons_period_threshold: 192 # Length of constant values from which on a period is considered constant
frozen_range: 12 # Number of consecutive identical values to consider the signal frozen
max_rec_period: 1000 # Maximum recording period (in 15-minute steps); null = derive from data

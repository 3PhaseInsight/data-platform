# Config for the statlabeler DAG, consumed by threephi_framework.StatLabeler.
# IMPORTANT: the keys must match StatLabelerConfig exactly (no extra keys, none missing).

dask:
  host: dask-scheduler
  port: "8786"
  n_workers: 4 # Used to chunk meters across workers; should not exceed the number of Dask workers

sm_ids: ["17", "999955", "999950", "999964"] # List of Smart Meter IDs to apply the StatLabeler on
data_dir_path: phase_measurements/raw # Object-storage path of the raw timeseries dataset

process_only_sm_with_hp: false # If true, only smart meters flagged with heat pumps are processed
overwrite_existing_results: false # If true, existing labeled results are recomputed
label_summerhouse: true # If true, summerhouses are labeled in the meta data
filter_data: true # If true, data is filtered (weekly-change filter) before processing
use_ANOVA: true # If true, an ANOVA test verifies the thermal-load relation before labeling

save_plots: false # If true, plots are saved during the run
save_meta_results: true # If true, detailed meta results are saved alongside the labels

thresholds:
  weekly_change: 0.01
  static_days: 0.4
  weekend_ratio: 0.45
  max_bins: 12
  min_bins: 1
  filter_temp: 3
  anova_pvalue: 0.01

results_dir: s3://3phi/stat_labeler
weather_file: s3://3phi/stat_labeler/data/weather_data.csv
weather_file_local: /opt/airflow/data/weather_data.csv

services:
  redis:
    ports:
      - "6379:6379"

  airflow-scheduler:
    image: airflow:dev
    volumes:
      - dags_volume:/opt/airflow/dags
      - local_data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    environment:
      - AIRFLOW__API__BASE_URL=http://localhost:8080

  airflow-worker:
    image: airflow:dev
    volumes:
      - dags_volume:/opt/airflow/dags
      - local_data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    environment:
      - AIRFLOW__API__BASE_URL=http://localhost:8080

  dask-scheduler:
    image: dask:dev
    ports:
      - "8786:8786"
      - "8787:8787"
    volumes:
      - local_data:/opt/airflow/data:ro

  dask-worker:
    image: dask:dev
    volumes:
      - local_data:/opt/airflow/data

  data-platform-api:
    image: data-platform-api:dev

volumes:
  airflow_logs:
  dags_volume:
    driver: local
    driver_opts:
      type: none
      device: ${DAGS_DIR:-../dags}
      o: bind
  local_data:
    driver: local
    driver_opts:
      type: none
      device: ./data
      o: bind